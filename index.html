<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlotte Cat Games - Links</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #1b3c6b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            background: #2d6cdf;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #4a8cff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Charlotte Cat Games</h1>

        <!-- Website -->
        <a class="btn" href="https://charlottecatgames-alt.github.io/" target="_blank">
            Website
        </a>

        <!-- Section -->
        <div class="section-title">Google Play - Games</div>

        <!-- Games -->
        <a class="btn" href="https://play.google.com/store/apps/details?id=com.CharlotteCatGames.CharlotteCrossing&pcampaignid=web_share" target="_blank">
            Charlotte Crossing
        </a>

        <a class="btn" href="https://play.google.com/store/apps/details?id=com.CharlotteCatGames.BrickColorBattle&pcampaignid=web_share" target="_blank">
            Color the Brick Battle
        </a>
    </div>

</body>
</html>
